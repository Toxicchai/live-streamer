name: Cloud Live Streamer

on:
  schedule:
    # Yeh automatically Indian Time ke mutabiq subah 4:55 AM par trigger hoga
    - cron: '25 23 * * *'
  workflow_dispatch:
    inputs:
      stream_source:
        description: 'Google Drive Link OR repository filename'
        required: false
        default: ''
      loop_stream:
        description: 'Loop continuously? (true/false)'
        required: false
        default: 'false'
        type: boolean

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools (FFmpeg & gdown)
        run: |
          sudo apt update
          sudo apt install -y ffmpeg python3-pip
          pip3 install --break-system-packages gdown

      - name: Prepare Video File
        id: prep
        run: |
          # Yahan apna Google Drive link default set kar diya hai taaki automatic run mein link mangna na pade
          DEFAULT_DRIVE_LINK="https://drive.google.com/file/d/1MbBfoyZJ01WVLIL305kTrkdZnF0-Xi9K/view?usp=drivesdk"
          
          SOURCE="${{ github.event.inputs.stream_source }}"
          if [ -z "$SOURCE" ]; then
            SOURCE="$DEFAULT_DRIVE_LINK"
          fi

          if [[ "$SOURCE" =~ drive.google.com ]]; then
            echo "Downloading video from Google Drive..."
            gdown "$SOURCE" -O stream_video.mp4
            echo "video_file=stream_video.mp4" >> $GITHUB_OUTPUT
          else
            echo "Using local file: $SOURCE"
            echo "video_file=$SOURCE" >> $GITHUB_OUTPUT
          fi

      - name: Start Live Stream to YouTube
        env:
          STREAM_KEY: ${{ secrets.STREAM_KEY }}
          LOOP: ${{ github.event.inputs.loop_stream }}
          VIDEO_FILE: ${{ steps.prep.outputs.video_file }}
        run: |
          if [ "$LOOP" = "true" ]; then
            LOOP_ARG="-stream_loop -1"
          else
            LOOP_ARG="-stream_loop 0"
          fi

          echo "Starting live broadcast to YouTube..."
          ffmpeg -re $LOOP_ARG -i "$VIDEO_FILE" -c:v copy -c:a aac -b:a 128k -ar 44100 -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"
          

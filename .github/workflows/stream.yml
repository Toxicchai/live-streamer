name: Cloud Live Streamer

on:
  workflow_dispatch:
    inputs:
      stream_source:
        description: 'Google Drive Link'
        required: false
        default: ''

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools (FFmpeg & gdown)
        run: |
          sudo apt update
          sudo apt install -y ffmpeg python3-pip
          pip3 install --break-system-packages gdown

      - name: Prepare Video File
        id: prep
        run: |
          # Yahan apna Gayatri Mantra video ka Google Drive link paste karein
          DEFAULT_LINK="https://drive.google.com/file/d/1tDmVL2VWrAPajhlllaIFGQzV2UkYhUM0/view?usp=drivesdk"
          
          SOURCE="${{ github.event.inputs.stream_source }}"
          if [ -z "$SOURCE" ]; then
            SOURCE="$DEFAULT_LINK"
          fi

          echo "Downloading video from Google Drive..."
          gdown "$SOURCE" -O stream_video.mp4
          echo "video_file=stream_video.mp4" >> $GITHUB_OUTPUT

      - name: Start Continuous Loop Stream to YouTube
        env:
          STREAM_KEY: ${{ secrets.STREAM_KEY }}
          VIDEO_FILE: ${{ steps.prep.outputs.video_file }}
        run: |
          echo "Broadcasting video in endless loop to YouTube..."
          ffmpeg -re -stream_loop -1 -i "$VIDEO_FILE" \
            -c:v libx264 -preset veryfast -b:v 4500k -maxrate 5000k -bufsize 10000k -pix_fmt yuv420p -g 60 \
            -c:a aac -b:a 128k -ar 44100 \
            -flvflags no_duration_filesize \
            -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"
            

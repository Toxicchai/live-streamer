name: Cloud Live Streamer

on:
  schedule:
    # शाम 6:55 PM IST (13:25 UTC) पर अपने आप ट्रिगर होगा
    - cron: '25 13 * * *'
  workflow_dispatch:
    inputs:
      stream_source:
        description: 'Google Drive Link'
        required: false
        default: ''

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools (FFmpeg & gdown)
        run: |
          sudo apt update
          sudo apt install -y ffmpeg python3-pip
          pip3 install --break-system-packages gdown

      - name: Prepare Video File
        id: prep
        run: |
          # यहाँ अपनी 2 मिनट की गायत्री मंत्र वीडियो का Google Drive लिंक डालें
          DEFAULT_LINK="PASTE_YOUR_GAYATRI_MANTRA_DRIVE_LINK_HERE"
          
          SOURCE="${{ github.event.inputs.stream_source }}"
          if [ -z "$SOURCE" ]; then
            SOURCE="$DEFAULT_LINK"
          fi

          echo "Downloading video from Google Drive..."
          gdown "$SOURCE" -O stream_video.mp4
          echo "video_file=stream_video.mp4" >> $GITHUB_OUTPUT

      - name: Start Continuous Loop Stream to YouTube
        env:
          STREAM_KEY: ${{ secrets.STREAM_KEY }}
          VIDEO_FILE: ${{ steps.prep.outputs.video_file }}
        run: |
          echo "Broadcasting video in endless loop to YouTube..."
          ffmpeg -re -stream_loop -1 -i "$VIDEO_FILE" -c:v copy -c:a aac -b:a 128k -ar 44100 -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"

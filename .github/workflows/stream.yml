name: Cloud Live Streamer

on:
  workflow_dispatch:
    inputs:
      stream_source:
        description: 'Google Drive Share Link OR File Name (e.g. video.mp4)'
        required: true
        default: ''
      loop_stream:
        description: 'Loop continuously? (true/false)'
        required: true
        default: 'false'
        type: boolean

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Tools (FFmpeg & gdown)
        run: |
          sudo apt update
          sudo apt install -y ffmpeg python3-pip
          pip3 install --break-system-packages gdown

      - name: Prepare Video File
        id: prep
        run: |
          SOURCE="${{ github.event.inputs.stream_source }}"
          
          # Check if input is a Google Drive link
          if [[ "$SOURCE" =~ drive.google.com ]]; then
            echo "Detected Google Drive link. Downloading video to cloud runner..."
            gdown "$SOURCE" -O stream_video.mp4 
            echo "video_file=stream_video.mp4" >> $GITHUB_OUTPUT
          else
            echo "Using file directly from repository: $SOURCE"
            echo "video_file=$SOURCE" >> $GITHUB_OUTPUT
          fi

      - name: Start Live Stream to YouTube
        env:
          STREAM_KEY: ${{ secrets.STREAM_KEY }}
          LOOP: ${{ github.event.inputs.loop_stream }}
          VIDEO_FILE: ${{ steps.prep.outputs.video_file }}
        run: |
          if [ "$LOOP" = "true" ]; then
            LOOP_ARG="-stream_loop -1"
          else
            LOOP_ARG="-stream_loop 0"
          fi

          echo "Starting live broadcast to YouTube using $VIDEO_FILE..."
          ffmpeg -re $LOOP_ARG -i "$VIDEO_FILE" -c:v copy -c:a aac -b:a 128k -ar 44100 -f flv "rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY"
